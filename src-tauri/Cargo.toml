[package]
name = "claude-defense-kit"
version = "0.1.0"
description = "Claude Defense Kit - Secure your Claude Code installation"
authors = ["Beyond Identity"]
edition = "2021"

[lib]
name = "claude_defense_kit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portpicker = "0.1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
